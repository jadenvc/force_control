[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyor-minimal"
version = "0.1.0"
description = "Standalone MuJoCo conveyor pick-place environment with a scripted heuristic"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "dm-control>=1.0.20",
    "mujoco>=3.2",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
conveyor-demo = "conveyor.cli:main"

[tool.setuptools.packages.find]
include = ["conveyor*"]

[tool.setuptools.package-data]
conveyor = ["assets/**/*"]
